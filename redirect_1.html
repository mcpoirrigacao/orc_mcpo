<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MCPO · Autenticação</title>
  <script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
</head>
<body>
<script>
  // Página de redirecionamento MSAL para SharePoint/OneDrive
  // Hospede este arquivo na mesma biblioteca do MCPO_Orcamentacao_App.html
  const msalInstance = new msal.PublicClientApplication({
    auth: {
      clientId: 'a02d9ccd-9650-4855-99ce-3ad5ec98c381',
      authority: 'https://login.microsoftonline.com/aa796efe-0373-4718-9911-6cbf0bfa260f',
    },
    cache: { cacheLocation: 'localStorage', storeAuthStateInCookie: true },
  });
  msalInstance.initialize().then(() => {
    msalInstance.handleRedirectPromise().then(() => {
      window.close(); // fecha o popup automaticamente
    });
  });
</script>
</body>
</html>
